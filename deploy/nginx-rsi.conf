# Native nginx site config (no Docker) - the same shape as client/nginx.conf,
# adapted for the systemd-run API instead of a "api" Docker network hostname.
# Install once (see server-setup.sh) to /etc/nginx/sites-available/rsi and
# symlink into sites-enabled/. deploy.sh never touches this file - only the
# `current` symlink under its `root` that it points at.

server {
    listen 80;
    server_name _;

    root /opt/rsi/current/client;
    index index.html;

    # Same-origin reverse proxy to the API: the SPA calls relative
    # /api/v1/... paths, so the browser never makes a cross-origin request
    # and CORS never comes into play. The API listens on loopback only
    # (see rsi-api.service / api.env's ASPNETCORE_URLS) - nginx is the only
    # thing exposed to the network.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # React Router (client-side routing): let the SPA handle any path that
    # isn't a real static file.
    location / {
        try_files $uri /index.html;
    }
}

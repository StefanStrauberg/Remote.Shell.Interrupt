server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the API container: the SPA calls relative
    # /api/v1/... paths (see src/config/env.ts — "Undefined API URL means
    # same-origin API"), so the browser never makes a cross-origin request
    # and the backend's CORS policy doesn't come into play at all.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # React Router (client-side routing): let the SPA handle any path that
    # isn't a real static file.
    location / {
        try_files $uri /index.html;
    }
}
